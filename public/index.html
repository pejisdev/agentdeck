<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Deck</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='1' y='1' width='6' height='6' rx='1.5' fill='%23d97757'/><rect x='9' y='1' width='6' height='6' rx='1.5' fill='%2355606e'/><rect x='1' y='9' width='6' height='6' rx='1.5' fill='%2355606e'/><rect x='9' y='9' width='6' height='6' rx='1.5' fill='%2355606e'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/vendor/xterm/css/xterm.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="login" hidden>
  <form id="loginForm">
    <div class="logo"><i></i><i></i><i></i><i></i></div>
    <h1>Agent Deck</h1>
    <p>Colle le token affiché dans <code>~/agentdeck/data/token</code></p>
    <input id="tokenInput" type="password" placeholder="Token" autocomplete="current-password">
    <button>Entrer</button>
    <div id="loginErr"></div>
  </form>
</div>

<div id="app">
  <aside id="sidebar">
    <header class="brand">
      <div class="logo"><i></i><i></i><i></i><i></i></div>
      <div><b>Agent Deck</b><small id="hostName"></small></div>
    </header>
    <input id="projFilter" class="filter" placeholder="Filtrer les projets…" spellcheck="false">
    <ul id="projList"></ul>
    <footer>
      <button id="addProj" class="ghost">+ Ajouter un dossier</button>
      <button id="refreshProj" class="ghost icon" title="Rescanner">↻</button>
    </footer>
  </aside>

  <main id="center">
    <header class="bar">
      <span id="projTitle" class="title">—</span>
      <span id="projPath" class="muted mono"></span>
      <span class="spacer"></span>
      <div class="seg" id="layoutSeg">
        <button data-layout="grid" title="Grille 2×2">▦</button>
        <button data-layout="cols" title="4 colonnes">▥</button>
        <button data-layout="rows" title="4 lignes">☰</button>
      </div>
      <button id="toggleFiles" class="ghost icon" title="Afficher/masquer les fichiers (Ctrl+B)">◧</button>
    </header>
    <div id="decks"><div class="empty-state">Choisis un projet à gauche</div></div>
  </main>

  <div class="gutter v" id="gutterV"></div>

  <section id="files">
    <header class="bar">
      <span class="title">Fichiers</span>
      <span class="spacer"></span>
      <button id="quickOpenBtn" class="ghost" title="Ouverture rapide (Ctrl+P)">Ctrl+P</button>
      <button id="refreshTree" class="ghost icon" title="Rafraîchir">↻</button>
    </header>
    <div id="tree"></div>
    <div class="gutter h" id="gutterH"></div>
    <div id="editorWrap">
      <div id="tabs"></div>
      <div id="editorToolbar" hidden>
        <span id="filePathLabel" class="mono muted"></span>
        <span class="spacer"></span>
        <button id="diffBtn" class="ghost small" title="Comparer avec HEAD">Diff</button>
        <button id="saveBtn" class="ghost small" title="Enregistrer (Ctrl+S)">Enregistrer</button>
      </div>
      <div id="editor"></div>
      <div id="diffEditor" hidden></div>
      <div id="preview" hidden></div>
      <div id="editorEmpty">Aucun fichier ouvert</div>
    </div>
  </section>
</div>

<div id="palette" hidden>
  <div class="palette-box">
    <input id="paletteInput" placeholder="Rechercher un fichier…" spellcheck="false" autocomplete="off">
    <ul id="paletteList"></ul>
  </div>
</div>

<div id="toast"></div>

<script src="/vendor/xterm/lib/xterm.js"></script>
<script src="/vendor/xterm-fit/lib/addon-fit.js"></script>
<script src="/vendor/xterm-links/lib/addon-web-links.js"></script>
<script src="/vendor/xterm-clipboard/lib/addon-clipboard.js"></script>
<script src="/vendor/monaco/min/vs/loader.js"></script>
<script src="/app.js"></script>
</body>
</html>
